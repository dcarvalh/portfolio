# Cloudflare Worker serving davidcarvalho.work/cv
name = "cv-download"
main = "src/index.js"
compatibility_date = "2026-09-30"

# Only /cv... goes to this Worker; the rest of the site stays on GitHub Pages.
# One wildcard pattern, because route matching includes the query string (/cv?s=fair).
routes = [
  { pattern = "davidcarvalho.work/cv*", zone_name = "davidcarvalho.work" },
]
# No separate *.workers.dev address once it lives on the domain.
workers_dev = false
preview_urls = false

[vars]
# Turnstile site key (public). .dev.vars overrides it with Cloudflare's test key for local testing.
TURNSTILE_SITE_KEY = "0x4AAAAAAFKC7VIAHKrxP5S2"
CV_KEY = "cv.pdf"                         # key of the PDF in the KV store
CV_FILENAME = "David_Carvalho_CV.pdf"     # file name the visitor gets
NOTIFY_FROM = "cv@davidcarvalho.work"
NOTIFY_TO = "david.belo.carvalho@gmail.com"
# Secrets (not in this file): TURNSTILE_SECRET_KEY, DOWNLOAD_SIGNING_KEY
#   local: .dev.vars    production: npx wrangler secret put <NAME>

# Private storage for the CV PDF (no public access; only this Worker can read it).
[[kv_namespaces]]
binding = "CV_STORE"
id = "038064b7dc9545588339e9c46b37aff3"

# Email to David on each download (Cloudflare Email Routing; the address must be verified there).
[[send_email]]
name = "NOTIFY"
destination_address = "david.belo.carvalho@gmail.com"
