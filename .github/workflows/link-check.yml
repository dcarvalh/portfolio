name: Link check

on:
  schedule:
    # Monday 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --config ./lychee.toml
            ./index.html
            ./README.md
            ./assets/i18n/*.json
          format: markdown
          output: lychee/out.md
          fail: false

      - name: Find existing broken-links issue
        id: find_issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update broken-links issue
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found on the portfolio
          content-filepath: ./lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.find_issue.outputs.number }}

      - name: Close resolved broken-links issue
        if: steps.lychee.outputs.exit_code == '0' && steps.find_issue.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh issue close "${{ steps.find_issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --comment "All links passing again."

      - name: Fail job if links are broken
        if: steps.lychee.outputs.exit_code != '0'
        run: exit 1
