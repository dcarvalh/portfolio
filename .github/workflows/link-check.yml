name: Link check

on:
  schedule:
    # Monday 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write # commit link fallback swaps
  issues: write
  pages: write # rebuild the site after a swap

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Links listed in .github/link-fallbacks.toml are switched to their
      # first live candidate before lychee runs.
      - name: Switch links to a live fallback
        id: fallbacks
        run: python3 .github/scripts/link_fallbacks.py

      - name: Commit and publish link fallback swaps
        if: steps.fallbacks.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.fallbacks.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -a -m "Link check: switch to a live fallback link" -m "$SUMMARY"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # Pushes made with GITHUB_TOKEN may not trigger a Pages build on their own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --config ./lychee.toml
            ./index.html
            ./README.md
            ./assets/i18n/*.json
          format: markdown
          output: lychee/out.md
          fail: false

      - name: Find existing broken-links issue
        id: find_issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update broken-links issue
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found on the portfolio
          content-filepath: ./lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.find_issue.outputs.number }}

      - name: Close resolved broken-links issue
        if: steps.lychee.outputs.exit_code == '0' && steps.find_issue.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh issue close "${{ steps.find_issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --comment "All links passing again."

      - name: Fail job if links are broken
        if: steps.lychee.outputs.exit_code != '0'
        run: exit 1
